<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="alfrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Letter A: Stylized chevron apex with central dot -->
  <g class="logo-a">
    <path d="M 40 125 L 85 36 C 89 29, 97 29, 101 36 L 146 125" 
          stroke="currentColor" 
          stroke-width="15" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Iconic Central Core Dot -->
    <circle cx="93" cy="98" r="7.5" fill="currentColor" />
  </g>

  <!-- Letter L: Clean rounded corner -->
  <g class="logo-l">
    <path d="M 172 32 L 172 110 C 172 122, 180 126, 194 126 L 244 126" 
          stroke="currentColor" 
          stroke-width="15" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Letter F: Aerodynamic top bar and mid bar -->
  <g class="logo-f">
    <!-- Top curved wing -->
    <path d="M 268 45 C 270 34, 282 32, 296 32 L 348 32 C 354 32, 358 35, 355 40 C 352 45, 342 46, 332 46 L 285 46 C 275 46, 272 52, 272 60 L 272 125" 
          stroke="currentColor" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Middle aerodynamic bar -->
    <path d="M 272 79 L 328 79 C 334 79, 338 82, 335 88 C 332 93, 324 93, 316 93 L 272 93" 
          fill="currentColor" />
  </g>

  <!-- Letter R: Fluid modern loop and diagonal kick -->
  <g class="logo-r">
    <!-- Top aerodynamic bar -->
    <path d="M 370 32 L 444 32 C 458 32, 468 40, 468 54 C 468 67, 458 75, 442 76 L 418 76" 
          stroke="currentColor" 
          stroke-width="15" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Diagonal kick with curved terminal -->
    <path d="M 406 76 C 418 76, 428 85, 434 94 L 460 125" 
          stroke="currentColor" 
          stroke-width="15" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
